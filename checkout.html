<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Voltio</title>
<link rel="icon" href="images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="container"><div class="crumbs"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div><h1>Checkout</h1></div></div>
<div class="container" id="checkoutWrap" style="padding:32px 0 64px"><div class="cart-layout" style="padding:0">
 <form id="checkoutForm" novalidate class="form-card"><h3>Delivery details</h3>
  <div class="two"><div class="field"><label for="name">Full name</label><input id="name" name="name" required minlength="3" autocomplete="name"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div></div>
  <div class="two"><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required pattern="[0-9+ \-]{10,15}" title="Enter a valid phone number" autocomplete="tel"></div>
  <div class="field"><label for="city">City</label><input id="city" name="city" required autocomplete="address-level2"></div></div>
  <div class="field"><label for="address">Street address</label><input id="address" name="address" required minlength="6" autocomplete="street-address"></div>
  <h3 style="margin-top:8px">Payment method</h3>
  <div class="pay"><label><input type="radio" name="payment" value="cod" checked> Cash on delivery</label><label><input type="radio" name="payment" value="bank"> Bank transfer</label><label><input type="radio" name="payment" value="card"> Card (demo, no payment taken)</label></div>
  <button class="btn btn-blue full" type="submit">Place order</button></form>
 <aside class="summary"><div id="miniItems"></div><div id="summary"></div></aside></div></div>
</main>
<div id="site-footer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
